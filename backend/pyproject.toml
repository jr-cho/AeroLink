[project]
name = "aerolink"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jr-cho", email = "joshmg426@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jsonschema[format-nongpl]>=4.26.0",
    "pydantic>=2.14.3",
    "referencing>=0.37.0",
]

[project.scripts]
aerolink = "aerolink:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
