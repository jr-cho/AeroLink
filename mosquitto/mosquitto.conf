# Eclipse Mosquitto 2.x for AeroLink (PLAN E6.2, ARCHITECTURE §12.1, §16).
# Paths are inside the container (compose.yaml mounts this folder at /mosquitto/config).

per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# Internal listener: backend and simulator on the compose network. Never published to the host
# in production (compose.yaml binds it to 127.0.0.1 for local debugging only).
listener 1883

# Device listener: TLS 1.2+, server certificate signed by the project CA (make-ca.sh).
listener 8883
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
cafile /mosquitto/certs/ca.crt
tls_version tlsv1.2
