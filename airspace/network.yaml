# AeroLink corridor network: hand-written connections (ARCHITECTURE §3.3).
# Corridor SHAPES come from FDOT highway GIS; this file says which nodes exist
# and which highway connects them. Build with `aerolink.airspace.build_network`.
#
# Sites: airspace/sites-evtol.geojson (FDOT Phase 1A survey) and
#        airspace/sites-helipads.geojson (FDEP Airports, medical pads near a corridor).
# Waypoints are approximate: move each one ONTO its highway after checking the map.

version: central-fl-v1

# How each highway is found in FDOT's Interstates / U.S. Highways / State Roads
# shapefiles (aerolink.airspace.fetch_fdot). Field confirmed with `fetch_fdot inspect`
# on the 2026-11-14 FDOT release.
highways:
  I-4:   { layer: interstates, field: RouteNum, value: "4" }
  US-27: { layer: us_roads,    field: RouteNum, value: "27" }
  US-98: { layer: us_roads,    field: RouteNum, value: "98" }
  SR-60: { layer: state_roads, field: RouteNum, value: "60" }
  US-17: { layer: us_roads,    field: RouteNum, value: "17" }      # US-17/92, Orlando - Kissimmee - Haines City

nodes:
  # Landing sites. `types`: evtol | helipad. Default `serves`:
  #   evtol -> passenger, helipad -> medical (ARCHITECTURE §3.2)

  # --- eVTOL sites ---------------------------------------------------------------
  ev-sef:         { types: [evtol], name: "Sebring Regional Airport", lat: 27.44987, lon: -81.33895, pads: 2, source: "hand survey (Phase 1A)", verified: true }
  ev-water-st:    { types: [evtol], name: "Water Street (Downtown Tampa)", lat: 27.94324, lon: -82.45089, pads: 2, source: "hand survey (Phase 1A)", verified: true }
  ev-orl:         { types: [evtol], name: "Orlando Executive Airport", lat: 28.54236, lon: -81.32218, pads: 2, source: "hand survey (Phase 1A)", verified: true }
  ev-parramore:   { types: [evtol], name: "Parramore (Downtown Orlando)", lat: 28.53395, lon: -81.38659, pads: 2, source: "hand survey (Phase 1A)", verified: true }
  ev-lal:         { types: [evtol], name: "Lakeland Linder Intl Airport", lat: 27.97893, lon: -82.01347, pads: 2, source: "hand survey (SIS reliever)", verified: true }
  ev-suntrax:     { types: [evtol], name: "SunTrax (FDOT AAM test site)", lat: 28.08700, lon: -81.78000, pads: 4, source: "FDOT AAM Business Plan first routes", verified: true }

  # --- Medical helipads (FDEP Airports, FAA identifiers) ---------------------------
  hp-5fl3:        { types: [helipad], name: "Brandon Hospital", lat: 27.93258, lon: -82.28884, pads: 1, source: "FDEP Airports 5FL3", verified: true }
  hp-fd28:        { types: [helipad], name: "Orlando Health Orlando Regional Medical Center", lat: 28.52516, lon: -81.37716, pads: 1, source: "FDEP Airports FD28", verified: true }
  hp-3fd5:        { types: [helipad], name: "Orlando Health Arnold Palmer Hospital for Children", lat: 28.52313, lon: -81.38019, pads: 1, source: "FDEP Airports 3FD5", verified: true }
  hp-fl000862:    { types: [helipad], name: "South Florida Baptist Hospital", lat: 28.01505, lon: -82.13850, pads: 1, source: "FDEP Airports FL000862", verified: true }
  hp-1fl7:        { types: [helipad], name: "Bartow Memorial Hospital", lat: 27.91899, lon: -81.84484, pads: 1, source: "FDEP Airports 1FL7", verified: true }
  hp-7fd7:        { types: [helipad], name: "Lakeland Regional Health Medical Center", lat: 28.06220, lon: -81.95434, pads: 1, source: "FDEP Airports 7FD7", verified: true }
  hp-9fd3:        { types: [helipad], name: "Highlands Regional Medical Center", lat: 27.46545, lon: -81.43187, pads: 1, source: "FDEP Airports 9FD3", verified: true }
  hp-37fa:        { types: [helipad], name: "AdventHealth Orlando", lat: 28.57566, lon: -81.36827, pads: 1, source: "FDEP Airports 37FA", verified: true }
  hp-77fl:        { types: [helipad], name: "AdventHealth Celebration", lat: 28.32932, lon: -81.54285, pads: 1, source: "FDEP Airports 77FL", verified: true }
  hp-fa52:        { types: [helipad], name: "AdventHealth Sebring", lat: 27.53804, lon: -81.50926, pads: 1, source: "FDEP Airports FA52", verified: true }
  hp-2fl9:        { types: [helipad], name: "AdventHealth Heart of Florida", lat: 28.18146, lon: -81.64277, pads: 1, source: "FDEP Airports 2FL9", verified: true }
  hp-85fd:        { types: [helipad], name: "AdventHealth Kissimmee", lat: 28.31538, lon: -81.40597, pads: 1, source: "FDEP Airports 85FD", verified: true }
  hp-fd99:        { types: [helipad], name: "Orlando Health Dr. P. Phillips Hospital", lat: 28.42958, lon: -81.47710, pads: 1, source: "FDEP Airports FD99", verified: true }
  hp-12fd:        { types: [helipad], name: "Osceola Regional Medical Center", lat: 28.29887, lon: -81.40986, pads: 1, source: "FDEP Airports 12FD", verified: true }
  hp-60fd:        { types: [helipad], name: "Winter Haven Hospital", lat: 28.02880, lon: -81.72503, pads: 1, source: "FDEP Airports 60FD", verified: true }
  hp-fd36:        { types: [helipad], name: "AdventHealth East Orlando", lat: 28.54122, lon: -81.27994, pads: 1, source: "FDEP Airports FD36", verified: true }
